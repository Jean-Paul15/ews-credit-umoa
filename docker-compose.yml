services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: ews-namenode
    environment:
      - CLUSTER_NAME=ews-credit
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      # Cluster de demo mono-utilisateur (pas de multi-tenant a isoler) :
      # simplifie l'ecriture depuis le conteneur Spark sans gestion d'ACL HDFS.
      - HDFS_CONF_dfs_permissions_enabled=false
    ports:
      - "9870:9870"
    volumes:
      - namenode-data:/hadoop/dfs/name
      - ./data/raw/events:/staging/events:ro
    mem_limit: 768m

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: ews-datanode
    depends_on:
      - namenode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SERVICE_PRECONDITION=namenode:9870
    volumes:
      - datanode-data:/hadoop/dfs/data
    mem_limit: 768m

  spark-master:
    build: ./docker/spark
    container_name: ews-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment:
      - PYTHONPATH=/opt/spark/work-dir/src
    volumes:
      - ./src:/opt/spark/work-dir/src:ro
      - ./tests:/opt/spark/work-dir/tests:ro
    ports:
      - "8080:8080"
      - "7077:7077"
    mem_limit: 1g

  spark-worker:
    build: ./docker/spark
    container_name: ews-spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - PYTHONPATH=/opt/spark/work-dir/src
    volumes:
      - ./src:/opt/spark/work-dir/src:ro
    mem_limit: 2200m

volumes:
  namenode-data:
  datanode-data:
