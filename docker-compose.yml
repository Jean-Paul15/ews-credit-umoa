services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: ews-namenode
    environment:
      - CLUSTER_NAME=ews-credit
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    ports:
      - "9870:9870"
    volumes:
      - namenode-data:/hadoop/dfs/name
      - ./data/raw/events:/staging/events:ro
    mem_limit: 768m

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: ews-datanode
    depends_on:
      - namenode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SERVICE_PRECONDITION=namenode:9870
    volumes:
      - datanode-data:/hadoop/dfs/data
    mem_limit: 768m

  spark-master:
    image: bitnami/spark:3.5
    container_name: ews-spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
    mem_limit: 1g

  spark-worker:
    image: bitnami/spark:3.5
    container_name: ews-spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
    mem_limit: 2200m

volumes:
  namenode-data:
  datanode-data:
