[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ews-credit"
version = "0.1.0"
description = "Systeme d'alerte precoce sur la degradation d'un portefeuille de credits (UMOA)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
spark = ["pyspark>=3.5"]
api = ["fastapi>=0.115", "uvicorn>=0.32"]

[tool.setuptools.packages.find]
where = ["src"]
