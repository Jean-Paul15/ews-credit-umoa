[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ews-credit"
version = "0.1.0"
description = "Systeme d'alerte precoce sur la degradation d'un portefeuille de credits (UMOA)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3",
    "numpy>=2.0",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Les tests spark_jobs/ s'executent dans Docker (docker/run_spark_tests.sh),
# pas sur le poste de dev : cet extra ne sert qu'a l'image du conteneur.
spark = ["pyspark==3.5.9"]
api = ["fastapi>=0.115", "uvicorn>=0.32"]
dashboard = ["streamlit>=1.38", "requests>=2.32"]
notebook = ["jupyter>=1.0", "nbconvert>=7.16", "matplotlib>=3.9", "scikit-learn>=1.5"]

[tool.setuptools.packages.find]
where = ["src"]
